[package]
name = "bliss-guidance-lastfm"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Last.fm guidance addon for Bliss playlist optimization"
repository = "https://github.com/chrober/bliss-guidance-lastfm"
publish = false

[dependencies]
bliss-playlist-guidance-spi = { git = "https://github.com/chrober/bliss-playlist-guidance-spi.git", rev = "3eb3af8" }
fs2 = "0.4"
httpdate = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
